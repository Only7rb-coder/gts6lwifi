name: build kernel
on:
  workflow_call:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Update dependencies
        run: |
          sudo apt update
          sudo apt install build-essential bc flex bison libncurses5-dev libssl-dev git ccache libtinfo5 libncurses5 dos2unix python-is-python3 lz4 tar -y

      - name: Install Toolchains
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone --depth=1 https://github.com/proprietary-stuff/llvm-arm-toolchain-ship-10.0 toolchain/llvm-arm-toolchain-ship/10.0

      - name: Prepare Environment
        run: |
          chmod +x scripts/*.sh || true
          find . -type f -name "Kconfig*" -exec dos2unix {} +
          find scripts/ -type f -name "*.sh" -exec dos2unix {} +

      - name: Build Kernel
        run: |
          GCC_PATH=$(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          CLANG_PATH=$(pwd)/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
          
          MAKE_ARGS="O=out \
                    ARCH=arm64 \
                    CROSS_COMPILE=$GCC_PATH \
                    REAL_CC=$CLANG_PATH \
                    CLANG_TRIPLE=aarch64-linux-gnu- \
                    DTC_EXT=dtc \
                    LLVM=1 \
                    LLVM_IAS=1 \
                    PYTHON=python3"

          mkdir -p out
          make -j$(nproc --all) $MAKE_ARGS gts6lwifi_eur_open_defconfig
          make -j$(nproc --all) $MAKE_ARGS

      - name: Download and Extract Samsung AP
        run: |
          # Replace the URL below with your actual firmware link
          ROM_URL="YOUR_DIRECT_LINK_HERE"
          wget -qO samsung_ap.tar "$ROM_URL"
          
          # Extract boot.img.lz4 from the AP tar
          tar -xf samsung_ap.tar boot.img.lz4 || tar -xf samsung_ap.tar boot.img
          
          # Decompress lz4 if necessary
          if [ -f boot.img.lz4 ]; then
            lz4 -d boot.img.lz4 boot.img
          fi

      - name: Patch Boot Image
        run: |
          # Download magiskboot to handle unpack/repack
          wget -qO magiskboot.zip https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -j magiskboot.zip "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

          # Unpack the original boot.img
          ./magiskboot unpack boot.img

          # Replace the kernel (usually called 'kernel' after unpack)
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image kernel
          else
            echo "New kernel Image not found!" && exit 1
          fi

          # Repack the boot image
          ./magiskboot repack boot.img new-boot.img

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/CCCC-L/anyKernel3 releases
          sed -i "s/{branch}/${{ github.ref_name }}/" releases/anykernel.sh
          rm -rf releases/.git
          
          # Move both the raw Image and the modded boot.img to releases
          mv out/arch/arm64/boot/Image releases/
          mv new-boot.img releases/boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modded-Kernel-T970-${{ github.ref_name }}
          path: releases
